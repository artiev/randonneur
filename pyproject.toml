[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "randonneur"
version = "0.1.0"
description = "Plot GPX tracks onto a hiking map."
readme = "README.rst"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "randonneur" }]
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "gpxpy>=1.6",
    "httpx>=0.27",
    "rich>=13",
    "uvicorn[standard]>=0.30",
    "watchfiles>=0.24",
]

[project.scripts]
randonneur = "randonneur.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
markers = [
    "integration: hits the real OpenTopoMap tile service. Slow and network-dependent; run with ``pytest -m integration``.",
]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/randonneur"]
