<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>randonneur</title>
  <link rel="icon" type="image/svg+xml" href="/media/favicon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-logo" src="/media/favicon.svg" alt="" width="20" height="20" />
      <h1>RANDONNEUR</h1>
    </div>
    <div class="folder-info">
      <span class="folder-info-label">Folder</span>
      <span id="folder-path" class="folder-path" aria-live="polite"></span>
    </div>
    <div class="header-actions">
      <button
        id="tab-button-settings"
        class="icon-button"
        type="button"
        title="Settings"
        aria-label="Settings"
        aria-expanded="false"
        aria-controls="side-panel"
      ><i class="fa-solid fa-gear" aria-hidden="true"></i></button>
      <button
        id="tab-button-edit"
        class="icon-button"
        type="button"
        title="Edit track metadata"
        aria-label="Edit track metadata"
        aria-expanded="false"
        aria-controls="side-panel"
      ><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i></button>
    </div>
  </header>

  <!-- Right-side tab. Anchored to the right edge of the viewport; the
       .open class on #side-panel slides it into view from off-screen.
       The tab hosts two mutually-exclusive views — Settings and Edit —
       selected by the two header buttons and shown via the panel's
       data-view attribute (only one .tab-view is visible at a time).
       The header sits at the top so the close button is always within
       reach. No backdrop: the tab takes its own column on the right
       when open, the map and profile panes resize beneath it via the
       .app-grid right margin. -->
  <section
    id="side-panel"
    class="side-panel"
    role="dialog"
    aria-labelledby="side-panel-title"
  >
    <header class="settings-header">
      <h2 id="side-panel-title">Settings</h2>
      <button
        id="side-panel-close"
        class="icon-button"
        type="button"
        title="Close"
        aria-label="Close"
      ><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </header>
    <div class="settings-body">
      <!-- Settings view: base layer + map controls. -->
      <div class="tab-view" data-view="settings" hidden>
        <fieldset class="settings-group">
          <legend>Base layer</legend>
          <div id="settings-sources" class="settings-sources">
            <!-- Populated from /api/settings. -->
          </div>
        </fieldset>
        <fieldset class="settings-group">
          <legend>Map controls</legend>
          <label class="settings-toggle">
            <input id="settings-scale" type="checkbox" />
            <span>Show scale bar</span>
          </label>
        </fieldset>
      </div>
      <!-- Edit view: metadata editor for the currently selected track.
           Populated by renderMetadataEditor() from the TrackSummary's
           metadata fields. The "Save" button POSTs the edited fields to
           PATCH /api/tracks/{id}/metadata; on success the cache is
           replaced and the track list + map update in place. The file
           is rewritten on the server (atomic tmp + os.replace) so a
           crash mid-save leaves the original GPX untouched. When no
           track is selected, #metadata-empty shows instead of the form. -->
      <div class="tab-view" data-view="edit" hidden>
        <div id="metadata-empty" class="metadata-empty">
          Select a track to edit its metadata.
        </div>
        <fieldset class="settings-group" id="metadata-group" hidden>
          <legend>Metadata</legend>
          <div class="metadata-target" id="metadata-target"></div>
          <div class="metadata-fields">
            <label class="metadata-field">
              <span class="metadata-label">Display name (track)</span>
              <input id="metadata-track-name" type="text" maxlength="1000"
                     placeholder="No display name set" />
            </label>
            <label class="metadata-field">
              <span class="metadata-label">Description (track)</span>
              <textarea id="metadata-track-desc" rows="3" maxlength="1000"
                        placeholder="No description set"></textarea>
            </label>
            <label class="metadata-field">
              <span class="metadata-label">GPX <code>name</code></span>
              <input id="metadata-meta-name" type="text" maxlength="1000"
                     placeholder="No <name> set" />
            </label>
            <label class="metadata-field">
              <span class="metadata-label">GPX <code>description</code></span>
              <textarea id="metadata-meta-desc" rows="3" maxlength="1000"
                        placeholder="No <desc> set"></textarea>
            </label>
            <label class="metadata-field">
              <span class="metadata-label">Author</span>
              <input id="metadata-meta-author" type="text" maxlength="1000"
                     placeholder="No <author> set" />
            </label>
          </div>
          <div class="metadata-actions">
            <button id="metadata-clear" type="button" class="metadata-button-secondary">
              <i class="fa-solid fa-eraser" aria-hidden="true"></i>
              Clear all
            </button>
            <button id="metadata-save" type="button" class="metadata-button-primary">
              <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
              Save
            </button>
          </div>
          <div id="metadata-status" class="metadata-status" role="status" aria-live="polite"></div>
        </fieldset>
      </div>
    </div>
  </section>

  <main class="app-grid">
    <aside class="sidebar">
      <h2 id="tracks-heading">Tracks <span class="tracks-count" id="tracks-count" aria-hidden="true"></span></h2>
      <div id="folder-status" class="folder-status" aria-live="polite"></div>
      <ul id="track-list" class="track-list" aria-label="GPX tracks">
        <li class="empty-hint">No folder loaded.</li>
      </ul>
      <section id="errors" class="errors" hidden>
        <h3>Could not parse</h3>
        <ul id="errors-list"></ul>
      </section>
    </aside>

    <section class="map-pane" aria-label="Map">
      <div id="map"></div>
    </section>

    <section class="profile-pane" aria-label="Elevation profile">
      <div class="profile-header">
        <span id="profile-title">No track selected</span>
        <span id="profile-stats"></span>
      </div>
      <div id="profile"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"
          charset="utf-8"></script>
  <script src="/app.js" defer></script>
</body>
</html>
