<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>randonneur</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>randonneur</h1>
    <div class="folder-info">
      <span class="folder-info-label">Folder</span>
      <span id="folder-path" class="folder-path" aria-live="polite"></span>
    </div>
    <div class="folder-status" id="folder-status" aria-live="polite"></div>
    <button
      id="settings-button"
      class="icon-button"
      type="button"
      title="Settings"
      aria-label="Settings"
      aria-expanded="false"
      aria-controls="settings-panel"
    >⚙</button>
  </header>

  <!-- Settings tab. Anchored to the right edge of the viewport; the
       .open class on #settings-panel slides it into view from off-
       screen. The header sits at the top of the tab (so the close
       button is always within reach). Sections stack vertically
       below it. No backdrop: the tab takes its own column on the
       right when open, the map and profile panes resize beneath it
       automatically via the app-grid columns. -->
  <section
    id="settings-panel"
    class="settings-panel"
    role="dialog"
    aria-labelledby="settings-title"
  >
    <header class="settings-header">
      <h2 id="settings-title">Settings</h2>
      <button
        id="settings-close"
        class="icon-button"
        type="button"
        title="Close"
        aria-label="Close settings"
      >×</button>
    </header>
    <div class="settings-body">
      <fieldset class="settings-group">
        <legend>Base layer</legend>
        <div id="settings-sources" class="settings-sources">
          <!-- Populated from /api/settings. -->
        </div>
      </fieldset>
      <fieldset class="settings-group">
        <legend>Map controls</legend>
        <label class="settings-toggle">
          <input id="settings-scale" type="checkbox" />
          <span>Show scale bar</span>
        </label>
      </fieldset>
    </div>
  </section>

  <main class="app-grid">
    <aside class="sidebar">
      <h2>Tracks</h2>
      <ul id="track-list" class="track-list" aria-label="GPX tracks">
        <li class="empty-hint">No folder loaded.</li>
      </ul>
      <section id="errors" class="errors" hidden>
        <h3>Could not parse</h3>
        <ul id="errors-list"></ul>
      </section>
    </aside>

    <section class="map-pane" aria-label="Map">
      <div id="map"></div>
    </section>

    <section class="profile-pane" aria-label="Elevation profile">
      <div class="profile-header">
        <span id="profile-title">No track selected</span>
        <span id="profile-stats"></span>
      </div>
      <div id="profile"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"
          charset="utf-8"></script>
  <script src="/app.js" defer></script>
</body>
</html>
